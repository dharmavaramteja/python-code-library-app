---
services:
  db:
    image: dharmavaramteja/python-oct:db
    ports:
      - "3306:3306"
    volumes:
      - mydata: /var/lib/sql/
    networks:
      - mynetwork
    deploy:
     resources :
      reservations :
           cpus: '0.25'
          memory : 100M
       limits:
           cpus: "0.25"
           memory: 200M

  auth_service:
    image: dharmavaramteja/python-oct:auth
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    deploy:
     resources :
       reservations :
           cpus: "0.25"
          memory : 100M
       limits:
           cpus: "0.25"
           memory: 200M
          
  book_service:
    image: dharmavaramteja/python-oct:book
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    deploy:
     resources :
       reservations :
           cpus: "0.25"
          memory : 100M  
       limits:
           cpus: "0.25"
           memory: 200M
           
  borrow_service:
    image: dharmavaramteja/python-oct:borrow
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    deploy:
     resources :
       reservations :
           cpus: "0.25"
          memory : 100M  
       limits:
           cpus: "0.25"
           memory: 200M

  frontend:
    image: dharmavaramteja/python-oct:frontend
    ports:
      - "5000:5000"
    deploy:
     resources :
       reservations :
           cpus: "0.25"
          memory : 100M  
       limits:
           cpus: "0.25"
           memory: 200M

networks:
  mynetwork:
    driver: overlay
voumes:
   mydata:
  
