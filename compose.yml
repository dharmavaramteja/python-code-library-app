---
services:
  db:
    image: dharmavaramteja/python:dbimage 
    ports:
      - "3306:3306"
    volumes:
      - mydata: /var/lib/sql/
    networks:
      - mynetwork

  auth_service:
    image: dharmavaramteja/python:authimage
    ports:
      - "5001:5001"
    networks:
      - mynetwork

          
  book_service:
    image: dharmavaramteja/python:bookimage
    ports:
      - "5002:5002"
    networks:
      - mynetwork
           
  borrow_service:
    image: dharmavaramteja/python:borrowimage
    ports:
      - "5003:5003"
    networks:
      - mynetwork

  frontend:
    image: harmavaramteja/python:frontend
    ports:
      - "5000:5000"
   

networks:
  mynetwork:
    driver: overlay
voumes:
   mydata:
  
