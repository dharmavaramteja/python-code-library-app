services:
  db:
    image: dharmavaramteja/python:dbimage
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: dharmavaramteja/python:authimage
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

  book_service:
    image: dharmavaramteja/python:bookimage
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: dharmavaramteja/python:borrowimage
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: dharmavaramteja/python:frontendimage
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: bridge
