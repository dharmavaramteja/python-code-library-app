---
services:
  db:
    image: dharmavaramteja/python:dbimage 
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    deploy:
      replicas: 3

  auth_service:
    image: dharmavaramteja/python:authimage
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    deploy:
      replicas: 3

          
  book_service:
    image: dharmavaramteja/python:bookimage
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    deploy:
      replicas: 2
           
  borrow_service:
    image: dharmavaramteja/python:borrowimage
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    deploy:
      replicas: 3

  frontend:
    image: harmavaramteja/python:frontend
    ports:
      - "5000:5000"
    deploy:
      replicas: 2
   

networks:
  mynetwork:
    driver: overlay
